name: Check and publish images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test AI Mock matching
        run: node --test tests/aimock-request-context.test.mjs
      - name: Build directory image
        run: docker build -f directory/Dockerfile -t wotbot-demo-kit/directory:check .
      - name: Test directory in its runtime image
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work
          --entrypoint python wotbot-demo-kit/directory:check
          -m unittest discover -s tests -p 'test_*.py'
      - name: Build AI Mock image
        run: docker build -f aimock/Dockerfile -t wotbot-demo-kit/aimock:check .
      - name: Check AI Mock entrypoint syntax
        run: >-
          docker run --rm --entrypoint node wotbot-demo-kit/aimock:check
          --check /app/wotbot-aimock.mjs

  publish:
    if: github.repository == 'wotbotdev/wotbot-demo-kit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aimock
            dockerfile: aimock/Dockerfile
          - image: directory
            dockerfile: directory/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        id: version
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          echo "number=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wotbotdev/wotbot-demo-kit-${{ matrix.image }}:${{ steps.version.outputs.number }}
          labels: org.opencontainers.image.source=https://github.com/wotbotdev/wotbot-demo-kit
